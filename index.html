<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Màu thanh địa chỉ trình duyệt trên điện thoại, đặt gần với màu nền tối của trang -->
<meta name="theme-color" content="#1a1210">
<title>For the Loves of My Lives — Tuan Le</title>
<meta name="description" content="For the Loves of My Lives — Tuan Le">

<!-- Preview khi paste link ra ngoài (Messenger/Zalo/Facebook...).
     LƯU Ý: đây là thẻ tĩnh, KHÔNG tự đọc theo CONFIG trong script bên dưới
     (vì các app đọc preview không chạy JavaScript) — nếu đổi tên album/nghệ sĩ/ảnh bìa,
     nhớ sửa thêm ở đây cho khớp. -->
<meta property="og:type" content="music.song">
<meta property="og:title" content="For the Loves of My Lives — Tuan Le">
<meta property="og:description" content="Nghe và tải về album mới nhất của Tuan Le">
<meta property="og:image" content="https://tuanle0210.github.io/ftloml/assets/cover.jpg">
<meta property="og:url" content="https://tuanle0210.github.io/ftloml/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/cover.jpg">
<script>
  /* Máy yếu (ít nhân CPU hoặc ít RAM): gắn class "lite" để tắt các hiệu ứng mờ nặng
     trên đĩa đang quay. Đĩa vẫn quay bình thường, chỉ bỏ lớp blur. */
  (function () {
    var cores = navigator.hardwareConcurrency || 8;
    var mem = navigator.deviceMemory || 8;
    if (cores <= 4 || mem <= 4) document.documentElement.classList.add('lite');
  })();
</script>
<link rel="preload" as="image" href="assets/Background.webp" fetchpriority="high">

<style>
  /* ============================================================
     BIẾN MÀU — giao diện chuyển dần từ tối (bài 1) sang sáng (bài 10).
     Giá trị dưới đây là màu của BÀI 1 (tối nhất), dùng lúc trang vừa mở.
     Các bài sau do JavaScript tự tính (xem mục "Theme chuyển dần theo bài").
     Muốn đổi màu tối/sáng ở 2 đầu, sửa THEME_DARK / THEME_LIGHT trong script.
  ============================================================ */
  :root {
    --accent: #df4a5e;         /* màu nhấn chính: play button, slider, nút CTA */
    --accent-contrast: #ffffff;

    --card-bg: #1a1210;
    --text: #f5efec;
    --text-soft: rgba(245,239,236,0.65);
    --border-soft: rgba(245,239,236,0.10);
    --track-btn-bg: rgba(245,239,236,0.08);
    --bg-overlay: rgba(0,0,0,0.55);  /* lớp phủ lên ảnh nền */
    --link-text: #ffffff;            /* chữ nút Streaming/Download */
    --accent-ink: #df4a5e;           /* chữ màu hồng trên nền card (nút Lyrics) */
  }

  * { box-sizing: border-box; }

  /* Hiệu ứng bấm mượt cho mọi nút/link có thể bấm — hơi lún nhẹ khi chạm */
  button, .streaming a, .socials a {
    transition: transform 0.15s ease;
    touch-action: manipulation; /* bấm nhanh 2 lần (vd. Next Next) không bị phóng to trang trên iPhone */
  }
  button:active, .streaming a:active, .socials a:active {
    transform: scale(0.95);
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }

  /* Ảnh nền cố định phía sau toàn trang, không dùng background-attachment:fixed
     để tránh lỗi hiển thị trên Safari/iOS. */
  .bg-layer {
    background-color: #1a1210;
    position: fixed;
    inset: 0;
    background-image: url('assets/Background.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
  }
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-overlay);
    z-index: -1;
  }

  .page {
    width: 100%;
    max-width: 480px;
    padding: 12px 20px 48px;
    position: relative;
    animation: page-fade-in 0.6s ease both;
  }

  @media (min-width: 600px) {
    .page {
      padding-left: 48px;
      padding-right: 48px;
    }
  }

  @keyframes page-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Cover + tên album ---------- */
  /* ---------- Màn hình đầu tiên ----------
     Ảnh bìa + tên + player + nút Stream & Download luôn vừa khít 1 màn hình.
     Ảnh bìa tự co giãn để lấp phần chỗ còn lại: màn hình cao thì ảnh to (tối đa
     bằng bề ngang khung player), màn hình thấp thì ảnh nhỏ lại. */
  .first-screen {
    display: flex;
    flex-direction: column;
    padding-bottom: 12px;
  }
  /* Đang mở Lyrics: cho khung dài ra tự nhiên */
  .first-screen.expanded {
    max-height: none !important;
  }
  .cover-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  @supports (width: 1cqh) {
    .first-screen {
      /* Không cao quá 1 màn hình (thiếu chỗ thì ảnh bìa tự co), nhưng cũng không
         kéo dài thêm khi dư chỗ -> không có khoảng hở thừa */
      max-height: calc(100vh - 12px);   /* 12px = khoảng đệm trên cùng của .page */
      max-height: calc(100svh - 12px);
    }
    .cover-wrap {
      /* Mặc định cao bằng bề ngang (ảnh vuông to nhất), thiếu chỗ thì tự co lại */
      flex: 0 1 auto;
      aspect-ratio: 1 / 1;
      min-height: 160px;    /* ảnh bìa không bao giờ nhỏ hơn mức này */
      container-type: size;
    }
    .cover-disc {
      width: min(100cqw, 100cqh) !important;
      max-width: none !important;
    }
  }
  /* Khung chứa ảnh + lỗ tròn giữa đĩa, giữ đúng kích thước 65% để lỗ luôn nằm
     đúng tâm ảnh cover bất kể cover-wrap rộng bao nhiêu. */
  .cover-disc {
    position: relative;
    /* Ảnh bìa rộng bằng khung player, nhưng không cao quá 42% chiều cao màn hình,
       để trên điện thoại vẫn nhìn thấy nút Play mà không phải cuộn */
    width: 100%;
    max-width: 42vh;
    max-width: 42svh;
    aspect-ratio: 1 / 1;
  }
  .cover-disc img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    display: block;
    animation: cover-spin 0.15s linear infinite;
    animation-play-state: paused;
    transition: border-radius 0.4s ease;
  }
  .cover-disc img.spinning {
    border-radius: 50%;
    /* Khoét THẬT một lỗ tròn giữa ảnh bằng CSS mask, thay vì vẽ đè màu đen lên trên.
       Vùng "black" trong gradient dưới đây = bị ẩn đi (trong suốt), để lộ background
       thật của trang (bg-layer/bg-overlay) xuyên qua đúng lỗ đó.
       Vùng "white" = ảnh hiển thị bình thường. Cần khai báo cả 2 tiền tố để chạy
       trên Chrome/Firefox (mask-image) lẫn Safari (-webkit-mask-image). */
    mask-image: radial-gradient(circle closest-side at center, black 0%, black 13%, white 14%, white 100%);
    -webkit-mask-image: radial-gradient(circle closest-side at center, black 0%, black 13%, white 14%, white 100%);
    /* Blur nhẹ để giả lập vệt mờ do quay nhanh (motion blur), giống cảm giác nhìn
       một cái đĩa CD thật đang chạy tít — bản thân CSS animation không tự tạo mờ,
       nên cần cộng thêm filter này mới có cảm giác "nhòe vì quay nhanh". */
    filter: blur(1.3px);
  }
  /* Vòng nhẫn kẹp đĩa — nằm giữa lỗ khoét thật và mặt đĩa, làm mờ (blur) đúng phần
     ảnh bìa nó đè lên, giả lập lớp nhựa mờ quanh lỗ CD thật. Bản thân vòng nhẫn
     cũng được khoét trống ở giữa (cùng kích thước với lỗ thật trên ảnh) để không
     làm mờ/ám màu lên đúng vùng lỗ trong suốt — chỉ mờ phần vành khuyên bao quanh. */
  .cover-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.35), 0 1px 2px rgba(255,255,255,0.25);
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.4s ease;
    pointer-events: none;
    mask-image: radial-gradient(circle closest-side at center, black 0%, black 50%, white 51%, white 100%);
    -webkit-mask-image: radial-gradient(circle closest-side at center, black 0%, black 50%, white 51%, white 100%);
  }
  /* Viền quanh lỗ khoét thật, giống viền nhựa cứng ở mép lỗ CD thật — không tô nền,
     chỉ vẽ đường viền + bóng đổ nhẹ để mắt nhận ra rõ ranh giới của lỗ trong suốt
     phía dưới (do mask ở trên tạo ra), chứ bản thân div này không che mất độ trong suốt. */
  .cover-hole {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 13%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: transparent;
    border: 2px solid rgba(0,0,0,0.4);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(255,255,255,0.15);
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.4s ease;
    pointer-events: none;
  }
  .cover-disc img.spinning ~ .cover-ring,
  .cover-disc img.spinning ~ .cover-hole {
    transform: translate(-50%, -50%) scale(1);
  }

  /* Máy yếu: bỏ blur trên ảnh đang quay và lớp kính mờ của vòng nhẫn
     (2 thứ này phải vẽ lại mỗi khung hình khi đĩa quay, rất tốn GPU) */
  .lite .cover-disc img.spinning {
    filter: none;
  }
  .lite .cover-ring {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: rgba(255,255,255,0.28);
  }
  /* Người dùng bật "Giảm chuyển động" trong cài đặt máy: đĩa vẫn thành hình tròn
     có lỗ ở giữa khi phát, nhưng đứng yên, không quay */
  @media (prefers-reduced-motion: reduce) {
    .cover-disc img.spinning {
      animation: none;
      filter: none;
    }
  }

  @keyframes cover-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .album-info {
    text-align: center;
    margin-top: 14px;
  }
  .album-info h1 {
    font-size: 1.5rem; /* tên album (trước đây 1.25rem) */
    font-weight: 700;
    margin: 0;
    line-height: 1.3;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
  }
  .album-info p {
    font-size: 1.1rem; /* tên nghệ sĩ (trước đây 0.95rem) */
    color: rgba(255,255,255,0.85);
    margin: 6px 0 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
  }

  /* ---------- Player card ---------- */
  .player {
    margin-top: 16px;
    background: var(--card-bg);
    border-radius: 20px;
    border: 1.5px solid var(--border-soft);
    padding: 16px 16px 18px;
  }

  .controls {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .controls button:not(.btn-lyrics-toggle) {
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .controls button img { display: block; }
  #btn-prev img, #btn-next img { width: 44px; height: 44px; }
  #btn-play img { width: 60px; height: 60px; }

  /* Nút Play nhấp nháy nhẹ trong lúc nhạc đang tải */
  #btn-play.loading img {
    animation: play-loading 0.9s ease-in-out infinite;
  }
  @keyframes play-loading {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    #btn-play.loading img { animation: none; opacity: 0.5; }
  }

  .btn-lyrics-toggle {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent-ink);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    text-shadow: none;
    transition: transform 0.15s ease;
  }
  /* Điện thoại hẹp (≤ 400px): nút Lyrics bị đè lên nút Next. Chừa chỗ cho nút Lyrics
     ở bên phải và thu hẹp khoảng cách giữa 3 nút điều khiển. */
  @media (max-width: 400px) {
    .controls {
      gap: 14px;
      padding-right: 58px;
    }
    .btn-lyrics-toggle {
      padding: 6px 10px;
    }
  }
  .btn-lyrics-toggle:active {
    transform: translateY(-50%) scale(0.92);
  }

  .lyrics-box {
    margin-top: 18px;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-line;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
    padding: 2px 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  /* Còn chữ bên dưới -> mờ dần ở mép dưới để gợi ý cuộn xuống */
  .lyrics-box.has-more {
    mask-image: linear-gradient(to bottom, black calc(100% - 48px), transparent);
    -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 48px), transparent);
  }
  .lyrics-box::-webkit-scrollbar {
    width: 6px;
  }
  .lyrics-box::-webkit-scrollbar-track {
    background: transparent;
  }
  .lyrics-box::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 999px;
  }

  .soundwave {
    display: block;
    width: 100%;
    height: 36px;
    margin-top: 12px;
  }

  .progress-row {
    position: relative; /* để đặt nhãn tên bài nổi phía trên khi kéo */
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .time-label {
    font-size: 0.75rem;
    color: var(--text-soft);
    min-width: 34px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  /* Vùng chạm cao 24px cho dễ bấm bằng ngón tay, còn phần nhìn thấy vẫn là
     thanh mảnh 4px (vẽ ở các rule -track bên dưới) */
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 24px;
    margin: 0;
    background: transparent;
    outline: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--border-soft);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    margin-top: -5px; /* căn nút tròn 14px vào giữa thanh 4px */
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }
  /* Firefox: tô màu phần đã nghe (Chrome/Safari dùng gradient ở rule bên dưới) */
  input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--progress-pct, 0%), var(--border-soft) 0%);
  }

  /* Nhãn tên bài nổi phía trên nút kéo khi đang kéo thanh tiến trình */
  .seek-label {
    position: absolute;
    bottom: 100%;
    left: 0;
    margin-bottom: 6px;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    text-shadow: none;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .seek-label.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Lưới 10 nút số ---------- */
  .track-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .track-grid button {
    height: 44px; /* trước đây là ô vuông; hạ thấp để cả trang vừa 1 màn hình */
    border-radius: 12px;
    border: none;
    background: var(--track-btn-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  .track-grid button.active {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  /* ---------- Nút "Nghe & Tải về" ---------- */
  .cta-static {
    display: block;
    width: fit-content;
    margin: 14px auto 0 auto;
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }

  /* ---------- Streaming / Download ---------- */
  .streaming {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .streaming a {
    display: grid;
    grid-template-columns: 36px 1fr 36px;
    align-items: center;
    width: 100%;
    padding: 14px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.2rem;
    background: var(--card-bg);
    border: 2px solid var(--accent);
    color: var(--link-text);
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    -webkit-tap-highlight-color: transparent;
    outline: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .streaming a:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }
  .streaming a img {
    grid-column: 1;
    justify-self: start;
    width: 36px;
    height: 36px;
    display: block;
  }
  .streaming a span {
    grid-column: 2;
    text-align: center;
  }

  /* ---------- Social icons cuối trang ---------- */
  .socials {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .socials a {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .socials a img {
    width: 22px;
    height: 22px;
    display: block;
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="page">

  <div class="first-screen">

  <div class="cover-wrap">
    <div class="cover-disc">
      <img id="cover-img" src="assets/cover.jpg" fetchpriority="high" alt="">
      <div class="cover-ring"></div>
      <div class="cover-hole"></div>
    </div>
  </div>

  <div class="album-info">
    <h1 id="album-title">For the Loves of My Lives</h1>
    <p id="artist-name">Tuan Le</p>
  </div>

  <div class="player">
    <div class="controls">
      <button id="btn-prev" aria-label="Bài trước">
        <img src="assets/icons/previous.svg" alt="">
      </button>
      <button id="btn-play" aria-label="Phát / Tạm dừng">
        <img id="play-icon" src="assets/icons/play.svg" alt="">

// ---------- Theme chuyển dần theo bài: bài 1 tối nhất -> bài 10 sáng nhất ----------
// Mỗi khi sang bài mới, toàn bộ màu (nền card, chữ, nút, lớp phủ ảnh nền) sẽ fade
// từ từ sang mức sáng của bài đó trong khoảng THEME_FADE_MS.
const root = document.documentElement;

const THEME_DARK  = { card: [26, 18, 16],    text: [245, 239, 236] }; // #1a1210 / #f5efec
const THEME_LIGHT = { card: [255, 253, 249], text: [43, 35, 32] };    // #fffdf9 / #2b2320
const THEME_ACCENT = [223, 74, 94];    // #df4a5e — giữ khớp với --accent trong CSS
const THEME_ACCENT_SOFT = [255, 214, 220]; // hồng nhạt, để chữ hồng vẫn đọc rõ trên nền xám tối

// Độ sáng nền card của từng bài: 0 = tối hẳn, 1 = sáng hẳn. Đúng 10 số, bài 1 → bài 10.
// Cố ý bước dài hơn ở bài 5 → 6: vùng xám ở giữa làm cả chữ trắng lẫn chữ đen đều khó đọc,
// nên bài 5 là "tối nhạt" và bài 6 là "sáng đục", chữ đổi màu đúng lúc chuyển qua đó.
const THEME_STEPS = [0, 0.07, 0.14, 0.21, 0.28, 0.62, 0.72, 0.81, 0.90, 1];
const THEME_FADE_MS = 2500; // thời gian fade giữa 2 bài (mili giây)

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function mix(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function rgb(c) { return 'rgb(' + c.map(Math.round).join(',') + ')'; }
function rgba(c, a) { return 'rgba(' + c.map(Math.round).join(',') + ',' + a.toFixed(3) + ')'; }
function smoothstep(e0, e1, x) {
  const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

// pos: vị trí bài dạng số thực (0 = bài 1, 9 = bài 10), cho phép nằm giữa 2 bài khi đang fade.
function applyThemeAt(pos) {
  const last = THEME_STEPS.length - 1;
  pos = Math.min(last, Math.max(0, pos));
  const i = Math.min(last - 1, Math.floor(pos));
  const u = THEME_STEPS[i] + (THEME_STEPS[i + 1] - THEME_STEPS[i]) * (pos - i); // độ sáng card
  const t = pos / last;                                                           // tiến độ album
  const k = smoothstep(0.42, 0.5, u); // 0 = kiểu chữ dark mode, 1 = kiểu chữ light mode

  const card = mix(THEME_DARK.card, THEME_LIGHT.card, u);
  const text = mix(THEME_DARK.text, THEME_LIGHT.text, k);

  // Chữ hồng / chữ nút link: ở vùng tối sáng dần lên cho dễ đọc, ở vùng sáng đậm dần về hồng gốc
  const lightInk = mix(THEME_LIGHT.text, THEME_ACCENT, Math.max(0, (u - 0.5) / 0.5));
  const darkInk = mix(THEME_ACCENT, THEME_ACCENT_SOFT, Math.min(1, u / 0.3));
  const accentInk = mix(darkInk, lightInk, k);
  const linkText = mix([255, 255, 255], lightInk, k);

  // Lớp phủ ảnh nền: bài 1 phủ đen 55%, bài 10 chỉ còn lớp trắng rất mỏng 8%
  const white = rgba([255, 255, 255], 0.08 * t);
  const overlay = 'linear-gradient(' + white + ',' + white + '), ' + rgba([0, 0, 0], 0.55 * (1 - t));

  const s = root.style;
  s.setProperty('--card-bg', rgb(card));
  s.setProperty('--text', rgb(text));
  s.setProperty('--text-soft', rgba(text, 0.65));
  s.setProperty('--border-soft', rgba(text, 0.10 - 0.02 * k));
  s.setProperty('--track-btn-bg', rgba(text, 0.08 - 0.02 * k));
  s.setProperty('--bg-overlay', overlay);
  s.setProperty('--link-text', rgb(linkText));
  s.setProperty('--accent-ink', rgb(accentInk));
  root.style.colorScheme = k < 0.5 ? 'dark' : 'light';
}

let themePos = 0;          // vị trí đang hiển thị
let themeTarget = 0;       // vị trí cần tới
let themeAnim = null;

function setThemeTrack(idx, instant) {
  if (idx === themeTarget && !instant) return;
  themeTarget = idx;
  if (themeAnim) cancelAnimationFrame(themeAnim);
  if (instant || reduceMotion.matches) {
    themePos = idx;
    applyThemeAt(themePos);
    return;
  }
  const from = themePos;
  const start = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - start) / THEME_FADE_MS);
    const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // ease-in-out
    themePos = from + (idx - from) * eased;
    applyThemeAt(themePos);
    themeAnim = p < 1 ? requestAnimationFrame(step) : null;
  };
  themeAnim = requestAnimationFrame(step);
}

setThemeTrack(0, true);

// ---------- Helper thời gian ----------
function parseTimeToSeconds(str) {
  const parts = str.split(':').map(Number);
  return parts[0] * 60 + parts[1];
}
function formatSeconds(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

const trackStartSeconds = CONFIG.audio.trackStarts.map(parseTimeToSeconds);

// ---------- Soundwave ----------
const soundwaveCanvas = document.getElementById('soundwave');
const swCtx = soundwaveCanvas.getContext('2d');

const SW_BAR_COUNT = 32;
const swIdleValues = new Array(SW_BAR_COUNT).fill(6);

// GHI CHÚ: file mp3 giờ nằm CÙNG DOMAIN với trang (assets/ trong repo), nên không còn
// bị chặn CORS như hồi còn host qua GitHub Release nữa. Vì vậy soundwave bên dưới đọc
// dữ liệu tần số THẬT từ nhạc đang phát, thông qua Web Audio API (AudioContext +
// AnalyserNode), thay vì kiểu giả lập ngẫu nhiên như trước.
//
// Cơ chế giả lập cũ (pickNewTargetValues/startFakeWaveTargetLoop/stopFakeWaveTargetLoop)
// vẫn được GIỮ LẠI làm phương án dự phòng — nếu trình duyệt nào đó không hỗ trợ Web Audio
// API (rất hiếm ở thời điểm hiện tại), soundwave sẽ tự động rơi về kiểu giả lập này thay
// vì đứng im hoàn toàn.
let swCurrentValues = swIdleValues.slice();
let swTargetValues = swIdleValues.slice();
let swTargetTimer = null;

function pickNewTargetValues() {
  const t = performance.now() / 600;
  const values = new Array(SW_BAR_COUNT);
  for (let i = 0; i < SW_BAR_COUNT; i++) {
    const wave = Math.sin(t + i * 0.4) * 0.5 + 0.5;
    const noise = Math.random() * 0.25;
    values[i] = Math.min(255, Math.max(10, (wave * 0.75 + noise) * 255));
  }
  return values;
}

function startFakeWaveTargetLoop() {
  if (swTargetTimer) return;
  swTargetValues = pickNewTargetValues();
  swTargetTimer = setInterval(() => {
    swTargetValues = pickNewTargetValues();
  }, 260);
}

function stopFakeWaveTargetLoop() {
  if (swTargetTimer) {
    clearInterval(swTargetTimer);
    swTargetTimer = null;
  }
  swTargetValues = swIdleValues.slice();
}

// Kích thước canvas được đo 1 lần rồi nhớ lại, chỉ đo lại khi đổi kích thước cửa sổ
// (trước đây đo lại ở mỗi khung hình, 60 lần/giây, rất tốn).
let swW = 0, swH = 0;
function resizeSoundwave() {
  const dpr = window.devicePixelRatio || 1;
  const rect = soundwaveCanvas.getBoundingClientRect();
  swW = rect.width;
  swH = rect.height;
  soundwaveCanvas.width = Math.max(1, rect.width * dpr);
  soundwaveCanvas.height = Math.max(1, rect.height * dpr);
  swCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeSoundwave);
resizeSoundwave();

function swRoundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

// Màu accent không đổi, nên chỉ đọc 1 lần rồi nhớ lại
let swAccent = null;
function getAccentColor() {
  if (!swAccent) {
    swAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#df4a5e';
  }
  return swAccent;
}

function drawSoundwave(values) {
  // Lúc trang vừa load có thể chưa đo được (kích thước = 0) -> thử đo lại
  if (swW <= 0 || swH <= 0) resizeSoundwave();
  const w = swW, h = swH;
  // Guard: lúc trang vừa load, canvas có thể chưa có kích thước (w hoặc h = 0)
  // vì layout/CSS chưa kịp áp dụng xong. Nếu vẽ lúc này, phép tính bề rộng cột
  // sóng sẽ bị âm và làm crash script (arcTo IndexSizeError), khiến toàn bộ
  // code phía sau (track grid, streaming buttons) không kịp chạy. Bỏ qua frame
  // này, đợi frame kế tiếp khi canvas đã có kích thước thật.
  if (w <= 0 || h <= 0) return false;
  swCtx.clearRect(0, 0, w, h);
  const gap = 3;
  const barWidth = (w - gap * (values.length - 1)) / values.length;
  swCtx.fillStyle = getAccentColor();
  for (let i = 0; i < values.length; i++) {
    const v = values[i] / 255;
    const barH = Math.max(3, v * h);
    const x = i * (barWidth + gap);
    const y = (h - barH) / 2;
    swRoundRect(swCtx, x, y, barWidth, barH, 3);
    swCtx.fill();
  }
}

// ---------- Web Audio API: đọc dữ liệu tần số thật từ nhạc đang phát ----------
// Phải khởi tạo AudioContext bên trong một hành động của người dùng (click/tap),
// nên setupAudioAnalyser()/ensureAudioCtxRunning() được gọi trong các nút Play và
// nút số bài hát bên dưới, không gọi tự động lúc trang vừa load.
let audioCtx = null;
let analyser = null;
let freqData = null;
let analyserReady = false;

function setupAudioAnalyser() {
  if (audioCtx) return; // đã khởi tạo rồi thì thôi, tránh tạo lại nhiều lần
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64; // fftSize/2 = 32 dải tần, khớp đúng SW_BAR_COUNT — CHỈ dùng để vẽ soundwave
    analyser.smoothingTimeConstant = 0.8; // làm mượt dữ liệu ngay trong AnalyserNode
    freqData = new Uint8Array(analyser.frequencyBinCount);

    source.connect(analyser);
    analyser.connect(audioCtx.destination); // đường DUY NHẤT phát ra loa, bắt buộc phải có
    analyserReady = true;
  } catch (e) {
    console.warn('Trinh duyet khong ho tro Web Audio API, dung soundwave gia lap thay the.', e);
    analyserReady = false;
  }
}

function ensureAudioCtxRunning() {
  setupAudioAnalyser();
  // Một số trình duyệt (đặc biệt Safari/iOS) tạo AudioContext ở trạng thái "suspended"
  // cho đến khi có tương tác người dùng — cần resume() thì mới thực sự chạy.
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Safari (đặc biệt trên iOS) có xu hướng tự "đóng băng" (suspended) AudioContext khi
// người dùng khoá màn hình hoặc chuyển sang app khác để tiết kiệm pin — lúc này thẻ
// <audio> vẫn tiếp tục chạy thời gian (currentTime vẫn tăng, trạng thái vẫn "playing")
// nhưng KHÔNG CÓ TIẾNG ra loa, vì đường phát âm thanh thật đang đi qua chính
// AudioContext đã bị đóng băng đó. Cách khắc phục: lắng nghe các sự kiện báo hiệu
// trang quay lại hoạt động (mở khoá màn hình, quay lại app, chuyển tab) và tự động
// resume() lại AudioContext ngay lập tức nếu nó đang ở trạng thái suspended trong
// khi nhạc vẫn đang được yêu cầu phát (audio.paused === false).
function resumeAudioCtxIfNeeded() {
  if (audioCtx && audioCtx.state === 'suspended' && !audio.paused) {
    audioCtx.resume();
  }
}
document.addEventListener('visibilitychange', resumeAudioCtxIfNeeded);
window.addEventListener('focus', resumeAudioCtxIfNeeded);
window.addEventListener('pageshow', resumeAudioCtxIfNeeded);

function soundwaveLoop() {
  let values;
  let lerpSpeed;

  if (analyserReady && !audio.paused) {
    // Đang phát nhạc và Web Audio API hoạt động bình thường -> dùng dữ liệu tần số thật
    analyser.getByteFrequencyData(freqData);
    values = freqData;
    lerpSpeed = 0.35; // dữ liệu thật đã có nhịp riêng, chỉ cần lerp nhẹ cho mượt khung hình
  } else if (analyserReady) {
    // Web Audio API hoạt động nhưng đang tạm dừng -> để các cột về mức nghỉ
    values = swIdleValues;
    lerpSpeed = 0.12;
  } else {
    // Web Audio API không khả dụng -> dùng lại cơ chế giả lập cũ
    values = swTargetValues;
    lerpSpeed = 0.09;
  }

  for (let i = 0; i < SW_BAR_COUNT; i++) {
    swCurrentValues[i] += ((values[i] || 0) - swCurrentValues[i]) * lerpSpeed;
  }
  const drew = drawSoundwave(swCurrentValues) !== false;

  // Đang dừng nhạc và các cột đã về hẳn mức nghỉ -> ngừng vẽ cho đỡ tốn pin.
  // Vòng lặp sẽ chạy lại khi bấm Play hoặc khi đổi kích thước cửa sổ.
  let settled = drew && audio.paused;
  if (settled) {
    for (let i = 0; i < SW_BAR_COUNT; i++) {
      if (Math.abs(swCurrentValues[i] - (values[i] || 0)) > 0.5) { settled = false; break; }
    }
  }
  if (settled) {
    swRunning = false;
    return;
  }
  requestAnimationFrame(soundwaveLoop);
}

let swRunning = false;
function startSoundwave() {
  if (swRunning) return;
  swRunning = true;
  requestAnimationFrame(soundwaveLoop);
}
// Đổi kích thước canvas sẽ xoá hình cũ, nên vẽ lại
window.addEventListener('resize', startSoundwave);
if (window.ResizeObserver) {
  new ResizeObserver(() => { resizeSoundwave(); startSoundwave(); }).observe(soundwaveCanvas);
}

audio.src = CONFIG.audio.src;
startSoundwave();

const btnPlay = document.getElementById('btn-play');
const playIcon = document.getElementById('play-icon');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const progress = document.getElementById('progress');

let isSeeking = false;

function setPlayIcon(isPlaying) {
  playIcon.src = isPlaying ? 'assets/icons/pause.svg' : 'assets/icons/play.svg';
}
new Image().src = 'assets/icons/pause.svg'; // tải sẵn icon Pause

const coverImg = document.getElementById('cover-img');
function setCoverSpinning(isPlaying) {
  if (isPlaying) {
    coverImg.classList.add('spinning');
    coverImg.style.animationPlayState = 'running';
  } else {
    coverImg.classList.remove('spinning');
    // Reset animation để lần play tiếp theo luôn bắt đầu lại từ góc 0 độ,
    // tránh dừng lại giữa chừng lúc hình đã trở về vuông (nhìn sẽ bị lệch).
    coverImg.style.animation = 'none';
    void coverImg.offsetWidth;
    coverImg.style.animation = '';
  }
}

// Gọi play() kèm xử lý lỗi: nếu không phát được (mất mạng, lỗi file...) thì trả nút về Play
function safePlay() {
  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      btnPlay.classList.remove('loading');
      if (audio.paused) {
        setPlayIcon(false);
        setCoverSpinning(false);
      }
    });
  }
}

btnPlay.addEventListener('click', () => {
  ensureAudioCtxRunning();
  if (audio.paused) {
    safePlay();
  } else {
    audio.pause();
  }
});
audio.addEventListener('play', () => {
  setPlayIcon(true);
  startSoundwave();
  updateTabTitle();
  if (audio.readyState < 3) btnPlay.classList.add('loading'); // chưa đủ dữ liệu -> nhấp nháy
  if (!analyserReady) startFakeWaveTargetLoop(); // fallback nếu Web Audio API không dùng được
});
audio.addEventListener('playing', () => {
  btnPlay.classList.remove('loading');
  setCoverSpinning(true);   // chỉ quay khi đã thật sự có tiếng
});
audio.addEventListener('waiting', () => {
  if (audio.paused) return;
  btnPlay.classList.add('loading');
  // Đang tải nhạc (vd. vừa nhảy bài) -> chỉ tạm dừng quay, giữ nguyên hình đĩa tròn.
  // (Trước đây đĩa bị biến về hình vuông rồi lại tròn mỗi lần nhảy bài.)
  coverImg.style.animationPlayState = 'paused';
});
audio.addEventListener('error', () => {
  btnPlay.classList.remove('loading');
  setPlayIcon(false);
  setCoverSpinning(false);
});
audio.addEventListener('pause', () => {
  btnPlay.classList.remove('loading');
  updateTabTitle();
  setPlayIcon(false);
  setCoverSpinning(false);
  if (!analyserReady) stopFakeWaveTargetLoop();
});

audio.addEventListener('loadedmetadata', () => {
  durationTimeEl.textContent = formatSeconds(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  currentTimeEl.textContent = formatSeconds(audio.currentTime);
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 1000 : 0;
  progress.value = pct;
  progress.style.setProperty('--progress-pct', (pct / 10) + '%');
  updateActiveTrack();
  resumeAudioCtxIfNeeded(); // lớp bảo hiểm thêm, phòng khi các sự kiện visibility/focus không bắt kịp
});

// Nhãn tên bài hiện phía trên nút kéo trong lúc kéo thanh tiến trình
const seekLabel = document.createElement('div');
seekLabel.className = 'seek-label';
seekLabel.setAttribute('aria-hidden', 'true');
progress.parentNode.appendChild(seekLabel);
let seekLabelTimer = null;

function showSeekLabel(time) {
  if (!audio.duration) return; // chưa biết độ dài file thì chưa tính được vị trí
  const idx = getCurrentTrackIndex(time);
  const name = (CONFIG.trackTitles && CONFIG.trackTitles[idx]) || ('Bài ' + (idx + 1));
  seekLabel.textContent = name;

  // Nút số tương ứng sáng lên ngay trong lúc kéo
  trackGrid.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === idx));

  // Đặt nhãn ngay trên nút kéo, nhưng không để tràn ra ngoài 2 mép
  const row = progress.parentNode;
  const pct = progress.value / 1000;
  const thumb = 14;
  let x = progress.offsetLeft + thumb / 2 + pct * (progress.offsetWidth - thumb);
  const half = seekLabel.offsetWidth / 2;
  x = Math.max(half, Math.min(row.clientWidth - half, x));
  seekLabel.style.left = (x - half) + 'px';

  seekLabel.classList.add('show');
  clearTimeout(seekLabelTimer);
}
function hideSeekLabel() {
  clearTimeout(seekLabelTimer);
  seekLabelTimer = setTimeout(() => seekLabel.classList.remove('show'), 400);
}

progress.addEventListener('input', () => {
  clearTimeout(seekCancelTimer); // vẫn đang kéo -> chưa chốt
  isSeeking = true;
  const pct = progress.value / 1000;
  const seekTime = pct * (audio.duration || 0);
  currentTimeEl.textContent = formatSeconds(seekTime);
  progress.style.setProperty('--progress-pct', (progress.value / 10) + '%');
  showSeekLabel(seekTime);
});
function commitSeek() {
  hideSeekLabel();
  if (!isSeeking) return;
  cancelResume();
  const pct = progress.value / 1000;
  audio.currentTime = pct * (audio.duration || 0);
  isSeeking = false;
}
progress.addEventListener('pointerup', hideSeekLabel);
progress.addEventListener('touchend', hideSeekLabel);
progress.addEventListener('blur', commitSeek);
progress.addEventListener('change', commitSeek);
// Kéo bị hủy giữa chừng (vd. ngón tay trượt thành cuộn trang): vẫn chốt vị trí,
// nếu không thanh tiến trình sẽ đứng im mãi. Chờ một chút rồi mới chốt, vì một số
// trình duyệt (Safari iOS) báo "hủy" ngay lúc bắt đầu kéo dù người dùng vẫn đang kéo.
let seekCancelTimer = null;
function commitSeekLater() {
  clearTimeout(seekCancelTimer);
  seekCancelTimer = setTimeout(commitSeek, 500);
}
progress.addEventListener('pointercancel', commitSeekLater);
progress.addEventListener('touchcancel', commitSeekLater);

function getCurrentTrackIndex(time) {
  let idx = 0;
  for (let i = 0; i < trackStartSeconds.length; i++) {
    if (time >= trackStartSeconds[i]) idx = i;
  }
  return idx;
}

function updateActiveTrack() {
  const idx = getCurrentTrackIndex(audio.currentTime);
  const buttons = trackGrid.querySelectorAll('button');
  buttons.forEach((b, i) => b.classList.toggle('active', i === idx));
  setThemeTrack(idx);
  if (lyricsMode && idx !== lyricsIdx) renderLyrics(idx); // chỉ ghi lại khi đổi bài
  updateTabTitle(idx);
}

// ---------- Tên bài trên tab trình duyệt ----------
// Đang phát: "▶ Mèo Đi Heels — Tuan Le". Đang dừng: tên album như bình thường.
const BASE_TITLE = CONFIG.album.title + ' — ' + CONFIG.album.artist;
function updateTabTitle(idx) {
  if (idx === undefined) idx = getCurrentTrackIndex(audio.currentTime);
  const name = CONFIG.trackTitles && CONFIG.trackTitles[idx];
  const next = (!audio.paused && name) ? '▶ ' + name + ' — ' + CONFIG.album.artist : BASE_TITLE;
  if (document.title !== next) document.title = next;
}

// ---------- Lyrics: chuyển đổi lưới số <-> khung lyrics ----------
const btnLyrics = document.getElementById('btn-lyrics');
const lyricsBox = document.getElementById('lyrics-box');
let lyricsMode = false;
let lyricsIdx = -1; // bài đang hiện lời trong khung lyrics

function renderLyrics(idx) {
  const text = CONFIG.lyrics[idx] || 'Lyrics đang được cập nhật...';
  lyricsBox.textContent = text;
  lyricsBox.scrollTop = 0; // sang bài mới thì cuộn về dòng đầu
  lyricsIdx = idx;
  updateLyricsFade();
}

// Bật/tắt lớp mờ ở mép dưới: chỉ hiện khi vẫn còn chữ chưa cuộn tới
function updateLyricsFade() {
  const more = lyricsBox.scrollTop + lyricsBox.clientHeight < lyricsBox.scrollHeight - 4;
  lyricsBox.classList.toggle('has-more', more);
}
lyricsBox.addEventListener('scroll', updateLyricsFade, { passive: true });
window.addEventListener('resize', () => { if (lyricsMode) updateLyricsFade(); });

// ---------- Bố cục màn hình đầu ----------
// 1) Màn hình quá thấp (vd. điện thoại xoay ngang): ảnh bìa đã co tới mức nhỏ nhất mà
//    vẫn không đủ chỗ -> cho khung dài ra, để phần Stream bên dưới không đè lên player.
// 2) Đang mở Lyrics: giữ nguyên cỡ và vị trí ảnh bìa, player chỉ dài ra phía dưới.
const coverWrap = document.querySelector('.cover-wrap');
const firstScreen = coverWrap.parentNode;
function layoutFirstScreen() {
  const lyricsScroll = lyricsBox.scrollTop;

  // Về bố cục gốc (lưới số) để đo
  coverWrap.style.flex = '';
  firstScreen.style.paddingTop = '';
  firstScreen.classList.remove('expanded');
  trackGrid.style.display = '';
  lyricsBox.style.display = 'none';
  firstScreen.style.maxHeight = '';
  if (firstScreen.scrollHeight - firstScreen.clientHeight > 1) {
    firstScreen.style.maxHeight = firstScreen.scrollHeight + 'px';
  }

  if (!lyricsMode) return;
  const offset = coverWrap.getBoundingClientRect().top - firstScreen.getBoundingClientRect().top;
  coverWrap.style.flex = '0 0 ' + coverWrap.offsetHeight + 'px';
  firstScreen.style.paddingTop = offset + 'px';
  firstScreen.classList.add('expanded');
  trackGrid.style.display = 'none';
  lyricsBox.style.display = 'block';
  lyricsBox.scrollTop = lyricsScroll;
}

btnLyrics.addEventListener('click', () => {
  lyricsMode = !lyricsMode;
  layoutFirstScreen();
  if (lyricsMode) {
    btnLyrics.textContent = 'Tracks';
    renderLyrics(getCurrentTrackIndex(audio.currentTime));
  } else {
    btnLyrics.textContent = 'Lyrics';
  }
});

// Xoay màn hình / đổi kích thước cửa sổ thì tính lại. Khi đang mở Lyrics chỉ tính lại
// lúc bề ngang đổi (xoay máy), vì thanh địa chỉ trên điện thoại ẩn/hiện liên tục khi cuộn.
let lastLayoutWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (lyricsMode && window.innerWidth === lastLayoutWidth) return;
  lastLayoutWidth = window.innerWidth;
  layoutFirstScreen();
  if (lyricsMode) updateLyricsFade();
});

// Vị trí "hiện tại" để tính bài trước/sau. Lúc vừa mở trang mà nhạc chưa tải xong,
// một số trình duyệt (Safari) vẫn báo 0:00 dù trang đang chờ nghe tiếp từ chỗ cũ.
function currentPosition() {
  return pendingResume !== null ? pendingResume : audio.currentTime;
}

btnNext.addEventListener('click', () => {
  const idx = getCurrentTrackIndex(currentPosition());
  cancelResume();
  const nextIdx = Math.min(idx + 1, trackStartSeconds.length - 1);
  audio.currentTime = trackStartSeconds[nextIdx];
});

btnPrev.addEventListener('click', () => {
  const now = currentPosition();
  const idx = getCurrentTrackIndex(now);
  cancelResume();
  // Nếu đã phát quá 3 giây trong bài hiện tại -> quay về đầu bài hiện tại (giống CD player thật)
  if (now - trackStartSeconds[idx] > 3) {
    audio.currentTime = trackStartSeconds[idx];
  } else {
    const prevIdx = Math.max(idx - 1, 0);
    audio.currentTime = trackStartSeconds[prevIdx];
  }
});

// ---------- Render 10 nút số ----------
CONFIG.audio.trackStarts.forEach((_, i) => {
  const btn = document.createElement('button');
  btn.textContent = String(i + 1);
  // Rê chuột vào nút số sẽ hiện tên bài (vd. "Mèo Đi Heels"); trình đọc màn hình cũng đọc được tên bài
  const trackName = CONFIG.trackTitles && CONFIG.trackTitles[i];
  if (trackName) {
    btn.title = trackName;
    btn.setAttribute('aria-label', 'Bài ' + (i + 1) + ': ' + trackName);
  }
  btn.addEventListener('click', () => {
    ensureAudioCtxRunning();
    cancelResume();
    audio.currentTime = trackStartSeconds[i];
    safePlay();
  });
  trackGrid.appendChild(btn);
});
updateActiveTrack();
layoutFirstScreen(); // đo bố cục sau khi đã có đủ 10 nút số

// ---------- Nhớ vị trí đang nghe ----------
// Lưu vị trí vào bộ nhớ trình duyệt vài giây một lần. Lần sau mở trang, thanh tiến
// trình, nút số bài và màu theme sẽ ở đúng chỗ cũ, bấm Play là nghe tiếp.
const RESUME_KEY = 'ftloml:position';
let pendingResume = null;
let lastSavedAt = 0;

function savePosition() {
  try {
    if (audio.currentTime > 1 && !audio.ended) {
      localStorage.setItem(RESUME_KEY, String(Math.floor(audio.currentTime)));
    }
  } catch (e) {}
}
function clearPosition() {
  try { localStorage.removeItem(RESUME_KEY); } catch (e) {}
}
function cancelResume() {
  pendingResume = null;
}

try {
  const saved = parseFloat(localStorage.getItem(RESUME_KEY));
  if (saved > 5) {
    pendingResume = saved;
    currentTimeEl.textContent = formatSeconds(saved);
    const idx = getCurrentTrackIndex(saved);
    trackGrid.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === idx));
    setThemeTrack(idx, true);
    // Trình duyệt sẽ nhảy tới đây khi file nhạc sẵn sàng. Safari cũ có thể báo lỗi ở
    // bước này -> bỏ qua, sự kiện loadedmetadata bên dưới sẽ nhảy lại sau.
    try { audio.currentTime = saved; } catch (e) {}
  }
} catch (e) {}

audio.addEventListener('loadedmetadata', () => {
  if (pendingResume === null) return;
  if (pendingResume < audio.duration - 5) {
    // Phòng hờ trình duyệt nào đó (Safari) bỏ qua lệnh nhảy lúc file chưa sẵn sàng
    if (Math.abs(audio.currentTime - pendingResume) > 1) audio.currentTime = pendingResume;
  } else {
    audio.currentTime = 0; // vị trí đã lưu không hợp lệ (vd. file nhạc đã đổi) -> nghe từ đầu
    clearPosition();
    setThemeTrack(0, true); // về màu bài 1 ngay, không fade ngược từ bài cuối về
  }
  pendingResume = null;
});
audio.addEventListener('timeupdate', () => {
  const now = Date.now();
  if (now - lastSavedAt > 5000) {
    lastSavedAt = now;
    savePosition();
  }
});
audio.addEventListener('pause', savePosition);
window.addEventListener('pagehide', savePosition);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') savePosition();
});

// ---------- Nghe hết album: cuộn xuống phần Stream & Download ----------
audio.addEventListener('ended', () => {
  clearPosition(); // lần sau mở trang sẽ nghe lại từ đầu
  document.getElementById('streaming-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ---------- Phím tắt trên máy tính ----------
// Space: phát / tạm dừng. Mũi tên phải: bài sau. Mũi tên trái: bài trước.
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.repeat) return; // giữ phím không bị bật/tắt hay chuyển bài liên tục
  const t = e.target;
  // Đang gõ chữ hoặc đang kéo thanh tiến trình thì để trình duyệt xử lý bình thường
  if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;

  if (e.code === 'Space') {
    // Space luôn là phát/tạm dừng. Trước đây nếu vừa bấm chuột vào một nút (vd. Prev),
    // nút đó vẫn đang được chọn nên Space lại bấm nút đó thay vì dừng nhạc.
    // (Người dùng bàn phím vẫn bấm nút đang chọn bằng phím Enter như bình thường.)
    if (t.closest && t.closest('a')) return; // đang chọn một link thì để yên
    e.preventDefault(); // chặn Space cuộn trang và chặn Space bấm vào nút đang chọn
    btnPlay.click();
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    btnNext.click();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    btnPrev.click();
  }
});

// ---------- Nút "Nghe & Tải về" scroll mượt ----------
document.getElementById('scroll-cta').addEventListener('click', () => {
  document.getElementById('streaming-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ---------- Render Streaming + Download (mảng linh hoạt) ----------
const streamingList = document.getElementById('streaming-list');
const allButtons = [...CONFIG.streaming, CONFIG.download];

allButtons.forEach(item => {
  const a = document.createElement('a');
  a.href = item.url;
  a.target = "_blank";
  a.rel = "noopener";
  if (item.icon) {
    const img = document.createElement('img');
    img.src = item.icon;
    img.alt = "";
    a.appendChild(img);
  }
  const span = document.createElement('span');
  span.textContent = item.name;
  a.appendChild(span);
  streamingList.appendChild(a);
});

// ---------- Render Social icons cuối trang ----------
const socialsList = document.getElementById('socials-list');

function addSocial(href, iconSrc, label) {
  const a = document.createElement('a');
  a.href = href;
  if (href.startsWith('http')) {
    a.target = "_blank";
    a.rel = "noopener";
  }
  a.setAttribute('aria-label', label);
  const img = document.createElement('img');
  img.src = iconSrc;
  img.alt = "";
  a.appendChild(img);
  socialsList.appendChild(a);
}

addSocial(CONFIG.social.facebook, 'assets/icons/facebook.svg', 'Facebook');
addSocial(CONFIG.social.instagram, 'assets/icons/instagram.svg', 'Instagram');
addSocial('mailto:' + CONFIG.social.email, 'assets/icons/mail.svg', 'Gmail');
</script>
